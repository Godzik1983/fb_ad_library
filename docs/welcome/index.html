<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FB AD LIBRARY is installed. Open Meta Ad Library, choose any ad, and the extension will open automatically."
    />
    <title>Welcome | FB AD LIBRARY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas class="fireworks" id="fireworks" aria-hidden="true"></canvas>
    <main class="page">
      <section class="hero">
        <div class="brand">
          <img src="./icon_32.png" alt="FB AD LIBRARY icon" />
          FB AD LIBRARY
        </div>
        <h1>Congratulations, FB AD LIBRARY is installed</h1>
        <p class="lead">
          Open Meta Ad Library, choose any ad, and FB AD LIBRARY will open automatically with instant ad insights.
        </p>

        <div class="steps" aria-label="How to start">
          <div class="step">
            <span class="num">1</span>
            <p>Click the button below.</p>
          </div>
          <div class="step">
            <span class="num">2</span>
            <p>Select any ad in Meta Ad Library.</p>
          </div>
          <div class="step">
            <span class="num">3</span>
            <p>FB AD LIBRARY opens automatically.</p>
          </div>
        </div>

        <a class="btn primary" href="https://www.facebook.com/ads/library/" target="_blank" rel="noopener noreferrer">
          Open Meta Ad Library
        </a>
      </section>
    </main>
    <script src="./fireworks.js"></script>
  </body>
</html>
